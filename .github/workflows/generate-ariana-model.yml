name: Generate Ariana 3D model
on:
  push:
    paths:
      - "character/ariana.params.json"
      - ".github/workflows/generate-ariana-model.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ArianaAI
        uses: actions/checkout@v4
      - name: Checkout Ara 3D Gen
        uses: actions/checkout@v4
        with:
          repository: olatunde85/3d-gen
          path: ara
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install generator
        working-directory: ara
        run: pnpm install --frozen-lockfile
      - name: Download CC0 character assets
        working-directory: ara
        run: pnpm run setup-assets
      - name: Generate high-detail rigged GLB
        working-directory: ara
        run: pnpm run export -- --params ../character/ariana.params.json --formats glb --detail high --out ../app/src/main/assets/models
      - name: Commit generated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/models/Ariana.glb
          if git diff --cached --quiet; then
            echo "Model unchanged"
          else
            git commit -m "Add generated rigged Ariana 3D model"
            git push
          fi
