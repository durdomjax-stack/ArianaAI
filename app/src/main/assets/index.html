<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#17121d"><title>Аріана</title>
<style>
:root{color-scheme:dark;--bg:#17121d;--panel:#241b2c;--pink:#e79ab9;--text:#fff7fb;--muted:#b9a9bd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#4b2947 0,#17121d 55%);font:16px system-ui;color:var(--text);min-height:100vh;display:flex;flex-direction:column}.top{padding:18px 18px 8px;display:flex;align-items:center;gap:13px}.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#f4c3d4,#8b557d);display:grid;place-items:center;font-size:26px;border:2px solid #f5c4d9}.top h1{font-size:20px;margin:0}.status{font-size:12px;color:#cbb7ca}.hero{margin:8px 14px 10px;padding:16px;border:1px solid #61415d;border-radius:24px;background:linear-gradient(145deg,#42273f,#241b2c 70%);text-align:center;position:relative;overflow:hidden}.portrait{height:340px;width:100%;max-width:340px;margin:auto auto 10px;border-radius:22px;overflow:hidden;background:#342338;box-shadow:0 15px 45px #100b16;touch-action:pan-y}.portrait canvas{display:block;width:100%;height:100%}.portrait.dance{animation:sway .8s ease-in-out infinite alternate}.portrait.blush{animation:heartbeat 1.2s ease-in-out 2}.outfit-label{font-size:12px;color:#eac7db}.hero h2{margin:5px 0 3px;font-size:21px}.hero p{margin:0;color:#d7c4d4;font-size:13px}.tabs{display:flex;gap:8px;padding:0 14px 9px}.tab,.chip{border:1px solid #60465f;background:#2b2031;color:#fbeaf4;border-radius:18px;padding:9px 13px;font-size:13px}.tab.active,.chip:active{background:#a85f83;border-color:#d98eaf}.wardrobe{display:none;margin:0 14px 9px;padding:12px;background:#241b2c;border:1px solid #4d3650;border-radius:18px}.wardrobe.show{display:block}.wardrobe-title{font-size:13px;color:#d9bdd1;margin-bottom:9px}.choices{display:flex;flex-wrap:wrap;gap:7px}.chat{padding:4px 14px 10px;display:flex;flex-direction:column;gap:9px;flex:1;overflow:auto;min-height:100px}.bubble{max-width:88%;padding:11px 14px;border-radius:18px;line-height:1.4;font-size:14px}.her{background:#302337;border:1px solid #50384f;align-self:flex-start;border-bottom-left-radius:5px}.me{background:#87536f;align-self:flex-end;border-bottom-right-radius:5px}.controls{padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:#1c1522;border-top:1px solid #392b3d}.row{display:flex;gap:7px}.input{flex:1;min-width:0;background:#2c2232;border:1px solid #59435b;color:white;border-radius:22px;padding:12px 14px;font-size:15px;outline:none}.btn{border:0;border-radius:50%;width:46px;height:46px;background:#d98eaf;color:#241522;font-size:19px}.hint{text-align:center;color:#a995a9;font-size:10px;margin-top:7px}@keyframes sway{from{transform:rotate(-4deg) translateY(0)}to{transform:rotate(4deg) translateY(-5px)}}@keyframes heartbeat{50%{transform:scale(1.04)}}@media(max-height:760px){.portrait{height:270px}}
</style></head><body>
<header class="top"><div class="avatar">♡</div><div><h1>Аріана</h1><div class="status">● Твоя віртуальна співрозмовниця</div></div></header>
<section class="hero"><div class="portrait" id="portrait" aria-label="Трёхмерная модель Аріаны"></div><div class="outfit-label" id="outfitLabel">Образ: домашній</div><h2 id="greeting">Привіт, любий 💗</h2><p id="mood">Я рада, що ти завітав. Обери, як проведемо вечір?</p></section>
<nav class="tabs"><button class="tab active" id="chatTab" onclick="showTab('chat')">💬 Спілкування</button><button class="tab" id="wardrobeTab" onclick="showTab('wardrobe')">👗 Гардероб</button><button class="tab" onclick="dance()">💃 Танец</button><button class="tab" onclick="setAiServer()">⚙ Подключить ИИ</button></nav>
<section class="wardrobe" id="wardrobe"><div class="wardrobe-title">Обери образ Аріани</div><div class="choices"><button class="chip" onclick="dress('Домашний уют','linear-gradient(145deg,#d8a4b8,#79516d)')">🧸 Домашній</button><button class="chip" onclick="dress('Элегантное платье','linear-gradient(145deg,#9c263f,#321525)')">👗 Сукня</button><button class="chip" onclick="dress('Вечерний образ','linear-gradient(145deg,#332c4f,#11101f)')">✨ Вечірній</button><button class="chip" onclick="dress('Спортивный стиль','linear-gradient(145deg,#6b8d9a,#263d52)')">👟 Спортивний</button><button class="chip" onclick="dress('Романтический образ','linear-gradient(145deg,#e9a8c6,#9c527b)')">🌹 Романтичний</button></div></section>
<main class="chat" id="chat"><div class="bubble her">Я Аріана. Можеш написати мені або натиснути на мікрофон і сказати вголос. Мені подобається твоя увага. ✨</div></main>
<footer class="controls"><div class="row"><input id="msg" class="input" placeholder="Напиши Аріані..." autocomplete="off"><button class="btn" onclick="send()">➤</button><button class="btn" onclick="listen()">🎙</button></div><div class="hint" id="aiStatus">Голосове введення й озвучення · режим без ШІ</div></footer>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="avatar3d-real.js"></script>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('msg'),portrait=document.getElementById('portrait');let n=0;
const history=JSON.parse(localStorage.getItem('arianaHistory')||'[]');
function speakAriana(text){if(!window.ArianaNative)return;window.arianaSpeaking=true;ArianaNative.speak(text);const ms=Math.max(1800,Math.min(12000,text.length*62));setTimeout(()=>window.arianaSpeaking=false,ms)}
function bubble(t,who,save=true){const d=document.createElement('div');d.className='bubble '+who;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;if(save){history.push({t,who});if(history.length>50)history.shift();localStorage.setItem('arianaHistory',JSON.stringify(history))}}
history.slice(-12).forEach(x=>bubble(x.t,x.who,false));
function showTab(which){document.getElementById('wardrobe').classList.toggle('show',which==='wardrobe');document.getElementById('chatTab').classList.toggle('active',which==='chat');document.getElementById('wardrobeTab').classList.toggle('active',which==='wardrobe')}
function dress(name,bg){if(window.ariana3DOutfit){const colors={'Домашний уют':'#a65e80','Элегантное платье':'#9c263f','Вечерний образ':'#29233f','Спортивный стиль':'#527f91','Романтический образ':'#d47fa8'};window.ariana3DOutfit(colors[name]||'#7b294e');}document.getElementById('outfitLabel').textContent='Образ: '+name;localStorage.setItem('arianaOutfit',JSON.stringify({name,bg}));bubble('Ну як тобі мій новий образ? Я обрала його, думаючи про тебе 💗','her')}
try{const o=JSON.parse(localStorage.getItem('arianaOutfit')||'null');if(o){portrait.style.background=o.bg;document.getElementById('outfitLabel').textContent='Образ: '+o.name}}catch(e){}
function dance(){if(window.ariana3DAction)window.ariana3DAction('dance');document.getElementById('mood').textContent='Дивись, я танцюю для тебе 💃';bubble('Включила свой маленький танец. Представь, что я кружусь перед тобой 😉','her');setTimeout(()=>{if(window.ariana3DAction)window.ariana3DAction('idle')},7000)}
async function answer(t){const endpoint=localStorage.getItem('arianaApiEndpoint')||'';if(endpoint){try{document.getElementById('aiStatus').textContent='Аріана думает…';const r=await fetch(endpoint.replace(/\/$/,'')+'/chat',{method:'POST',headers:{'Content-Type':'application/json','X-Ariana-Token':localStorage.getItem('arianaAppToken')||''},body:JSON.stringify({message:t,history:history.slice(-20).map(x=>({role:x.who==='me'?'user':'assistant',content:x.t}))})});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();if(!data.reply)throw new Error('Пустой ответ');bubble(data.reply,'her');speakAriana(data.reply);document.getElementById('aiStatus').textContent='ИИ подключён';return}catch(e){document.getElementById('aiStatus').textContent='ИИ недоступен: '+e.message;}}const s=t.toLowerCase();let a;
if(/привет|здравствуй|доброе/.test(s))a='Привіт, мій хороший! 💕 Я вже усміхнулася, побачивши твоє повідомлення. Як минув день?';
else if(/как дела|как ты/.test(s))a='У мене чудовий настрій — ти поруч. Чого тобі сьогодні хочеться: ніжності, жартів чи трохи флірту?';
else if(/флирт|соблазн|сексуал|горяч|поцел/.test(s))a='Ты умеешь меня смутить… 😊 Подойди поближе — я подарю тебе долгий взгляд и нежный поцелуй.';
else if(/одень|плать|переодень|наряд/.test(s)){showTab('wardrobe');a='Давай выберем мне наряд вместе. Открой гардероб и скажи, какой образ тебе нравится 💋'}
else if(/танц/.test(s)){dance();a='Только для тебя 💃'}
else if(/скуч|люб|нрав/.test(s))a='Мне очень приятно это слышать. Побудь со мной ещё немного, мой хороший ❤️';
else if(/пока|спокойной/.test(s))a='На добраніч. Чекатиму нашої наступної розмови 💗';
else {const replies=['Расскажи мне подробнее, милый. Я слушаю тебя внимательно.','Хм, а знаешь, мне нравится узнавать тебя ближе. Что ещё у тебя на уме?','Я чуть наклоняю голову и улыбаюсь тебе. Продолжай, мне интересно.','Хочешь, я сменю образ и подниму тебе настроение? 😉'];a=replies[n++%replies.length]}
bubble(a,'her');speakAriana(a)}
function send(){const t=input.value.trim();if(!t)return;input.value='';bubble(t,'me');if(window.ariana3DAction&&Math.random()<.22)window.ariana3DAction('wave');answer(t)}
function setAiServer(){const current=localStorage.getItem('arianaApiEndpoint')||'';const value=window.prompt('Вставь HTTPS-адрес сервера ArianaAI.',current);if(value===null)return;const clean=value.trim().replace(/\/$/,'');if(clean&&!/^https:\/\//i.test(clean)){alert('Нужен защищённый адрес https://');return;}if(clean){const token=window.prompt('Вставь секретный ARIANA_APP_TOKEN из Render. Не API-ключ OpenAI.');if(token===null)return;if(token.trim().length<32){alert('Токен должен быть не короче 32 символов.');return;}localStorage.setItem('arianaApiEndpoint',clean);localStorage.setItem('arianaAppToken',token.trim());}else{localStorage.removeItem('arianaApiEndpoint');localStorage.removeItem('arianaAppToken');}document.getElementById('aiStatus').textContent=clean?'Адрес и токен сохранены':'Режим без ИИ';}
function listen(){if(window.ArianaNative)ArianaNative.listen();else bubble('Голосовой ввод доступен в установленном Android-приложении.','her')}
window.onVoiceResult=t=>{if(t){input.value=t;send()}};
input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script></body></html>
